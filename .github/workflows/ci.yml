name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Format, analyze, test, and build Android
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true

      - name: Report toolchain
        run: flutter --version

      - name: Resolve locked dependencies
        run: flutter pub get

      - name: Generate localization code
        run: flutter gen-l10n

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test with machine-readable results
        run: flutter test --coverage --machine > test-results.json

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cueverse-ci-${{ github.run_id }}
          path: |
            test-results.json
            coverage/lcov.info
            build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: ignore
          retention-days: 14
