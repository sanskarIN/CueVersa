name: Feature request
description: Suggest an original, fair, accessible improvement
title: "feat: "
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Explain the need without referring to copying a commercial game.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: fairness
    attributes:
      label: Fairness, accessibility, privacy, and monetization impact
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: originality
    attributes:
      label: Originality
      options:
        - label: This request does not require copied branding, art, UI, audio, or proprietary assets.
          required: true
